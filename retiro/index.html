<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Retiro — Anderson Bellini</title>
  <meta name="description" content="Fotos do retiro Anderson Bellini — Terapeuta.">
  <style>
    :root {
      --accent: #c9a781;
      --accent-dark: #4f3e36;
      --muted: #595959;
      --bg: #ffffff;
      --radius: 20px;
      --maxw: 1240px;
      font-family: "DM Sans", Inter, system-ui, -apple-system;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #111; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    .container { max-width: var(--maxw); margin: 0 auto; padding: 40px 28px; }

    /* ── HEADER ── */
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
    .brand { display: flex; align-items: center; gap: 18px; text-decoration: none; color: inherit; }
    .logo {
      width: 78px; height: 78px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #c9a781, #4f3e36);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 26px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    nav { display: flex; gap: 32px; }
    nav a { color: #3d3d3d; text-decoration: none; font-weight: 600; font-size: 16px; transition: .25s; }
    nav a:hover { color: var(--accent); }
    .cta {
      background: linear-gradient(135deg, #c9a781, #4f3e36);
      color: #fff; padding: 14px 22px;
      border-radius: var(--radius); text-decoration: none;
      font-weight: 700; font-size: 16px;
      box-shadow: 0 6px 16px rgba(106,62,161,0.28); transition: .25s;
    }
    .cta:hover { filter: brightness(0.9); }

    /* ── CAROUSEL SECTION ── */
    .carousel-section { padding: 60px 0; }
    .carousel-section h2 { font-size: 36px; font-weight: 800; margin-bottom: 32px; }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
      background: #1c1410;
      box-shadow: 0 16px 48px rgba(0,0,0,0.20);
    }

    .carousel-track img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      user-select: none;
    }
    .carousel-track img.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── NAV BUTTONS ── */
    .carousel-btn {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.90);
      border: none; border-radius: 50%;
      font-size: 22px; cursor: pointer;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      color: var(--accent-dark);
      transition: background .2s, color .2s, transform .2s;
    }
    .carousel-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }
    .carousel-btn.prev { left: -26px; }
    .carousel-btn.next { right: -26px; }

    /* ── COUNTER ── */
    .carousel-counter {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .6px;
      color: var(--muted);
    }

    /* ── THUMBNAILS ── */
    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .thumbnails::-webkit-scrollbar { height: 4px; }
    .thumbnails::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
    .thumbnails::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .thumb {
      flex: 0 0 90px; height: 60px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2.5px solid transparent;
      opacity: 0.55;
      transition: border-color .2s, opacity .2s, transform .2s;
      scroll-snap-align: start;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.active { border-color: var(--accent); opacity: 1; transform: scale(1.07); }
    .thumb:hover:not(.active) { opacity: 0.85; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state svg { opacity: 0.3; margin-bottom: 16px; display: block; margin-inline: auto; }

    /* ── FOOTER ── */
    footer {
      padding: 48px 0;
      color: var(--muted);
      font-size: 16px;
      text-align: center;
      border-top: 1px solid #f0f0f0;
      margin-top: 40px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { display: none; }
      .carousel-btn.prev { left: 8px; }
      .carousel-btn.next { right: 8px; }
    }
    @media (max-width: 600px) {
      .thumb { flex: 0 0 68px; height: 46px; }
      .carousel-btn { width: 38px; height: 38px; font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="container">
    <a class="brand" href="../">
      <div class="logo">AB</div>
      <div>
        <div style="font-weight:800;font-size:larger">Anderson Bellini</div>
        <div style="font-size:13px;color:var(--muted)">Terapeuta</div>
      </div>
    </a>
    <nav>
      <a href="../#sobre">Sobre</a>
      <a href="../#servicos">Serviços</a>
      <a href="../#contato">Contato</a>
      <a class="cta" href="../#contato">Agendar</a>
    </nav>
  </header>

  <main class="container">
    <section class="carousel-section">
      <h2>Retiro</h2>
      <div id="carouselRoot"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> Anderson Bellini — Terapeuta · Todos os direitos reservados
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.getElementById('carouselRoot');

    function showEmpty() {
      root.innerHTML = `
        <div class="empty-state">
          <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <p>Nenhuma imagem disponível no momento.</p>
        </div>`;
    }

    // Usa a GitHub Contents API para listar automaticamente todos os
    // arquivos de imagem da pasta retiro/img — funciona no GitHub Pages.
    const GITHUB_API = 'https://api.github.com/repos/andersonbellini-dev/anderbellini.github.io/contents/retiro/img';

    fetch(GITHUB_API, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(files => {
        const images = files
          .filter(f => f.type === 'file' && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
          .map(f => 'img/' + f.name);

        if (!images.length) { showEmpty(); return; }
        buildCarousel(images);
      })
      .catch(() => showEmpty());

    function buildCarousel(IMAGES) {
      let current = 0;

      /* ── DOM: wrapper ── */
      const wrapper = document.createElement('div');
      wrapper.className = 'carousel-wrapper';

      /* ── DOM: track com imagens ── */
      const track = document.createElement('div');
      track.className = 'carousel-track';

      IMAGES.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = `Foto ${i + 1} do retiro`;
        img.draggable = false;
        if (i === 0) img.classList.add('active');
        track.appendChild(img);
      });

      /* ── DOM: botões anterior / próximo ── */
      const btnPrev = btn('prev', '&#8592;', 'Foto anterior');
      const btnNext = btn('next', '&#8594;', 'Próxima foto');
      btnPrev.addEventListener('click', () => go(current - 1));
      btnNext.addEventListener('click', () => go(current + 1));

      wrapper.appendChild(btnPrev);
      wrapper.appendChild(track);
      wrapper.appendChild(btnNext);

      /* ── DOM: contador ── */
      const counter = document.createElement('div');
      counter.className = 'carousel-counter';

      /* ── DOM: faixa de miniaturas ── */
      const strip = document.createElement('div');
      strip.className = 'thumbnails';

      IMAGES.forEach((src, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (i === 0 ? ' active' : '');
        const tImg = document.createElement('img');
        tImg.src = src;
        tImg.alt = `Miniatura ${i + 1}`;
        tImg.loading = 'lazy';
        thumb.appendChild(tImg);
        thumb.addEventListener('click', () => go(i));
        strip.appendChild(thumb);
      });

      root.appendChild(wrapper);
      root.appendChild(counter);
      root.appendChild(strip);

      refreshCounter();

      /* ── Swipe / touch ── */
      let touchX = 0;
      track.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
      });

      /* ── Teclado ── */
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  go(current - 1);
        if (e.key === 'ArrowRight') go(current + 1);
      });

      /* ── Navegação ── */
      function go(index) {
        const imgs   = track.querySelectorAll('img');
        const thumbs = strip.querySelectorAll('.thumb');

        imgs[current].classList.remove('active');
        thumbs[current].classList.remove('active');

        current = ((index % IMAGES.length) + IMAGES.length) % IMAGES.length;

        imgs[current].classList.add('active');
        thumbs[current].classList.add('active');
        refreshCounter();

        thumbs[current].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      function refreshCounter() {
        counter.textContent = `${current + 1} / ${IMAGES.length}`;
      }

      function btn(cls, html, label) {
        const b = document.createElement('button');
        b.className = `carousel-btn ${cls}`;
        b.setAttribute('aria-label', label);
        b.innerHTML = html;
        return b;
      }
    }
  </script>
</body>
</html>
